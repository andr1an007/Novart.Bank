<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/main.css">
  <title>Document</title>
</head>

<body>
  <main class="register-page">
    <div class="background-mark"></div>

    <a class="brand" href="index.html">
      <img class="logo" src="img/logo2.0.png" alt="">
    </a>

    <div class="register-content">
      <div class="steps">
        <div class="steps__item active">
          <span class="steps__number">1</span>
          <span>Account details</span>
        </div>

        <span class="steps__line"></span>

        <div class="steps__item">
          <span class="steps__number">2</span>
          <span>Verify email</span>
        </div>

        <span class="steps__line"></span>

        <div class="steps__item">
          <span class="steps__number">3</span>
          <span>All set</span>
        </div>
      </div>

      <section class="register-card">
        <header class="register-card__heading">
          <h1>Create your account</h1>
          <p>Start managing your finances in one place.</p>
        </header>

        <form id="registerForm">
          <div class="field">
            <label for="registerName">Full name</label>
            <input id="registerName" type="text" placeholder="Andrian Konovart" required />
          </div>

          <div class="field">
            <label for="registerEmail">Email address</label>
            <input id="registerEmail" type="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label for="registerPassword">Password</label>

            <div class="password-field">
              <input id="registerPassword" type="password" minlength="8" required />
              <button class="password-toggle" type="button" data-password="registerPassword">
                <i class="bi bi-eye"></i>
              </button>
            </div>

            <small>At least 8 characters</small>
          </div>

          <div class="field">
            <label for="registerConfirmPassword">Confirm password</label>

            <div class="password-field">
              <input id="registerConfirmPassword" type="password" required />
              <button class="password-toggle" type="button" data-password="registerConfirmPassword">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <label class="terms">
            <input id="registerTerms" type="checkbox" />
            <span>
              I agree to the <a href="#">Terms of Service</a> and
              <a href="#">Privacy Policy</a>.
            </span>
          </label>

          <p class="error" id="registerError"></p>

          <button class="continue-button" type="submit">Continue</button>
        </form>

        <p class="sign-in">
          Already have an account? <a href="signin.html">Sign in</a>
        </p>

        <p class="support">
          Need help? <a href="#">Contact support</a>
        </p>
      </section>
    </div>
  </main>





























  <script src="js/register.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
