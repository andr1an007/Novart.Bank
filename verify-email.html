<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/main.css">
    <title>Novart Bank: Create Account</title>
</head>
<body>
    <main class="verify-page">
    <div class="background-mark"></div>

    <a class="brand" href="index.html">
       <img class="logo" src="img/logo2.0.png" alt="">
    </a>

    <div class="verify-content">
      <div class="steps">
        <div class="steps__item done">
          <span class="steps__number"><i class="bi bi-check-lg"></i></span>
          <span>Account details</span>
        </div>

        <span class="steps__line"></span>

        <div class="steps__item active">
          <span class="steps__number">2</span>
          <span>Verify email</span>
        </div>

        <span class="steps__line"></span>

        <div class="steps__item">
          <span class="steps__number">3</span>
          <span>All set</span>
        </div>
      </div>

      <section class="verify-card">
        <div class="email-icon">
          <i class="bi bi-envelope"></i>
        </div>

        <h1>Verify your email</h1>

        <p class="verify-card__text">
          We sent a 6-digit code to
          <strong id="verifyEmailAddress">you@example.com</strong>
        </p>

        <form id="verifyEmailForm">
          <div class="code-inputs">
            <input class="code-input" type="text" inputmode="numeric" maxlength="1" autofocus />
            <input class="code-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="code-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="code-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="code-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="code-input" type="text" inputmode="numeric" maxlength="1" />
          </div>

          <p class="timer">Code expires in <span id="countdown">10:00</span></p>

          <p class="resend">
            Didn't receive the code?
            <button id="resendCode" type="button">Resend code</button>
          </p>

          <p class="verify-error" id="verifyError"></p>

          <button class="verify-button" type="submit">Verify email</button>
        </form>

        <a class="back-link" href="register.html">
          <i class="bi bi-arrow-left"></i>
          Back to account details
        </a>

        <p class="support">
          Need help? <a href="#">Contact support</a>
        </p>
      </section>
    </div>
  </main>























    <script src="js/verify-email.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</body>
</html>
