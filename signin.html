<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/main.css">
    <title>Document</title>
</head>
<body>
     <main class="login-page">
    <div class="background-mark"></div>

    <a class="brand" href="index.html">
     <img class="logo" src="img/logo2.0.png" alt="">
    </a>

    <section class="login-card">
      <div class="login-icon">
        <i class="bi bi-lock"></i>
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to continue to your Novart account.</p>

      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email address</label>
          <input id="loginEmail" type="email" required />
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>

          <div class="password-field">
            <input id="loginPassword" type="password" required />
            <button class="password-toggle" id="showPassword" type="button">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="login-options">
          <label class="remember">
            <input id="rememberMe" type="checkbox" />
            Remember me
          </label>

          <a href="#">Forgot password?</a>
        </div>

        <p class="login-error" id="loginError"></p>

        <button class="sign-in-button" type="submit">Sign in</button>
      </form>

      <div class="divider">or</div>

      <p class="create-account">
        Don't have an account? <a href="register.html">Create account</a>
      </p>

      <p class="support">
        Need help? <a href="#">Contact support</a>
      </p>
    </section>
  </main>






















    <script src="js/singin.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</body>
</html>
