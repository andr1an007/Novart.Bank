<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/main.css">
  <title>Document</title>
</head>

<body>
  <main class="all-set-page">
    <div class="background-mark"></div>

    <a class="brand" href="index.html">
      <img class="logo" src="img/logo2.0.png" alt="">
    </a>

    <div class="content">
      <div class="steps">
        <div class="steps__item done">
          <span class="steps__number"><i class="bi bi-check-lg"></i></span>
          <span>Account details</span>
        </div>

        <span class="steps__line"></span>

        <div class="steps__item" done>
          <span class="steps__number"><i class="bi bi-check-lg"></i></span>
          <span>Verify email</span>
        </div>

        <span class="steps__line"></span>

        <div class="steps__item" active>
          <span class="steps__number">3</span>
          <span>All set</span>
        </div>
      </div>

      <section class="all-set-card">
        <div class="success-icon">
          <span class="success-check"></span>
        </div>

        <h1>You're all set!</h1>
        <p>Your Novart account has been created successfully.</p>

        <div class="verified-box">
          <span class="verified-box__icon">
            <span class="verified-check"></span>
          </span>

          <div>
            <strong>Email verified</strong>
            <span>You can now start managing your finances.</span>
          </div>
        </div>

        <button class="dashboard-button" id="goToDashboard" type="button">
          Go to dashboard
        </button>

        <a class="wallet-link" href="index.html" id="setUpWallet">
          Set up your wallet first
          <i class="bi bi-arrow-right"></i>
        </a>

        <p class="support">
          Need help? <a href="#">Contact support</a>
        </p>
      </section>
    </div>
  </main>






















  <script src="js/all-set.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
